name: orbit-workspace

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit
    ports:
      - "5432:5432"
    volumes:
      - orbit-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal-postgresql:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    volumes:
      - orbit-temporal-data:/var/lib/postgresql
    profiles: [temporal]

  temporal:
    image: temporalio/auto-setup:1.23.1
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgresql
    ports:
      - "7233:7233"
    depends_on:
      - temporal-postgresql
    profiles: [temporal]

  temporal-ui:
    image: temporalio/ui:2.57.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      - temporal
    profiles: [temporal]

volumes:
  orbit-db-data:
  orbit-temporal-data:
